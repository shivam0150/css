<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playwrite+CA+Guides&display=swap');
        .parent {
            text-decoration: underline;
            text-transform: uppercase;
            text-align: center;
            vertical-align: middle;
            line-height: 1.5;
        }
        .yo {
            font-family: 'Playwrite CA Guides', cursive;
            font-size: 18px;
            color: #ff6600;
            text-shadow: 2px 2px #7f5739;
        }
        .child {
            text-decoration: line-through;
            text-transform: lowercase;
            text-align: left;
            vertical-align: baseline;
            line-height: 2.7;
        }
        .container {
  height: 100px;
  line-height: 100px;
  border: 1px solid #ccc;
}
    </style>
</head>
<body><div class="yo">
    <h1>TEXT PROPERTIES</h1></div>
    <div class="parent">
        <p>Text properties control how text looks and sits inside elements</p>
    </div>
    <div class="child">
        <p>Text properties include text color, font size, font family, text alignment, line height, letter spacing, and text decoration</p>
    </div>
    <div class="container">
        <p>Text properties can be applied to any HTML element </p>
    </div>  
</body>
</html>
